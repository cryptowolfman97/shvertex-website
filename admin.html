<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin | SH Vertex</title>
  <link rel="icon" type="image/png" href="./assets/site/favicon.png"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;400;700;800;900&display=swap');
    :root {
      --shv-black: #000000;
      --shv-green: #22c55e;
      --shv-border: rgba(255,255,255,0.08);
      --shv-surface: rgba(255,255,255,0.03);
    }
    * { box-sizing: border-box; }
    body {
      margin:0; background:#000; color:#fff; font-family:'Plus Jakarta Sans',sans-serif;
      scroll-behavior:smooth; -webkit-font-smoothing:antialiased;
    }
    .admin-shell { max-width:1200px; margin:0 auto; padding:2rem 1rem; }
    .glass-card {
      background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.015));
      border:1px solid rgba(255,255,255,0.08); border-radius:1.5rem;
      backdrop-filter:blur(12px); padding:1.5rem; margin-bottom:1.5rem;
    }
    .btn {
      display:inline-flex; align-items:center; justify-content:center; padding:.6rem 1.2rem;
      border-radius:999px; font-size:.75rem; font-weight:800; letter-spacing:.08em;
      text-transform:uppercase; cursor:pointer; border:none; text-decoration:none;
      transition:all .2s; color:#000;
    }
    .btn-green { background:#22c55e; }
    .btn-green:hover { background:#fff; color:#000; }
    .btn-dark { background:rgba(255,255,255,0.06); color:#fff; border:1px solid rgba(255,255,255,0.12); }
    .btn-dark:hover { background:#fff; color:#000; }
    .btn-danger { background:#ef4444; color:#fff; }
    .btn-danger:hover { background:#fff; color:#000; }
    .input, .textarea {
      width:100%; padding:.75rem 1rem; background:rgba(255,255,255,0.03);
      border:1px solid rgba(255,255,255,0.08); border-radius:1rem; color:#fff;
      font-family:inherit; outline:none; margin:.25rem 0 .75rem;
    }
    .input:focus, .textarea:focus { border-color:#22c55e; }
    .label { font-size:.7rem; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:#9ca3af; }
    .table-row { display:grid; grid-template-columns:2fr 1fr 1fr auto; gap:1rem; align-items:center; padding:.75rem 0; border-bottom:1px solid rgba(255,255,255,0.06); }
    .hidden { display:none !important; }
    .toast { padding:1rem; border-radius:1rem; margin-bottom:1rem; }
    .toast.success { background:rgba(34,197,94,0.15); border:1px solid rgba(34,197,94,0.25); color:#d1fae5; }
    .toast.error { background:rgba(248,113,113,0.15); border:1px solid rgba(248,113,113,0.25); color:#fecaca; }
  </style>
</head>
<body class="bg-black">
  <div class="admin-shell">
    <!-- Login screen (shown when not admin) -->
    <div id="loginScreen" class="glass-card" style="max-width:400px; margin:4rem auto;">
      <h2 class="text-xl font-black mb-4">Admin Login</h2>
      <form id="loginForm">
        <label class="label" for="adminEmail">Email</label>
        <input class="input" id="adminEmail" type="email" placeholder="admin@example.com" required/>
        <label class="label" for="adminPassword">Password</label>
        <input class="input" id="adminPassword" type="password" placeholder="Your password" required/>
        <button class="btn btn-green w-full mt-4" type="submit">Sign In</button>
      </form>
      <p id="loginError" class="text-red-400 text-sm mt-3 hidden"></p>
    </div>

    <!-- Admin dashboard (shown only for ceo.shvertex@gmail.com) -->
    <div id="adminDashboard" class="hidden">
      <div class="flex items-center justify-between mb-6">
        <h1 class="text-2xl font-black tracking-tight">Admin Panel</h1>
        <button id="signOutBtn" class="btn btn-dark">Sign Out</button>
      </div>

      <!-- Downloads section -->
      <div class="glass-card">
        <h2 class="text-lg font-black mb-4"><i class="fas fa-download text-green-400 mr-2"></i>Download Links</h2>
        <div id="downloadsList" class="mb-4"></div>
        <div id="downloadToast" class="toast hidden"></div>
      </div>

      <!-- Products section -->
      <div class="glass-card mt-6">
        <h2 class="text-lg font-black mb-4"><i class="fas fa-cubes text-green-400 mr-2"></i>Products</h2>
        <div id="productsList" class="mb-4"></div>
        <div>
          <button id="addProductBtn" class="btn btn-green"><i class="fas fa-plus mr-2"></i>Add Product</button>
        </div>
        <div id="productForm" class="hidden mt-4">
          <h3 id="productFormTitle" class="font-bold mb-2">New Product</h3>
          <label class="label" for="prodName">Name</label>
          <input class="input" id="prodName" type="text" placeholder="Product name" required/>
          <label class="label" for="prodTagline">Tagline</label>
          <input class="input" id="prodTagline" type="text" placeholder="Short tagline"/>
          <label class="label" for="prodDesc">Description</label>
          <textarea class="textarea" id="prodDesc" rows="3" placeholder="Brief description"></textarea>
          <label class="label" for="prodImage">Image URL</label>
          <input class="input" id="prodImage" type="text" placeholder="./assets/site/image.png"/>
          <label class="label" for="prodSlug">Slug (for detail page URL)</label>
          <input class="input" id="prodSlug" type="text" placeholder="app-name"/>
          <label class="label" for="prodTags">Tags (comma separated)</label>
          <input class="input" id="prodTags" type="text" placeholder="tag1, tag2, tag3"/>
          <label class="label" for="prodStatus">Status</label>
          <select class="input" id="prodStatus">
            <option value="live">Live</option>
            <option value="coming-soon">Coming Soon</option>
          </select>
          <div class="flex gap-3 mt-4">
            <button id="saveProductBtn" class="btn btn-green">Save</button>
            <button id="cancelProductBtn" class="btn btn-dark">Cancel</button>
          </div>
          <input type="hidden" id="editingProductId"/>
        </div>
        <div id="productToast" class="toast hidden mt-4"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="shv-supabase-config.js"></script>
  <script>
    (function() {
      const ADMIN_EMAIL = 'ceo.shvertex@gmail.com';
      let supabase = null;
      let currentUser = null;

      // Init Supabase
      function initSupabase() {
        if (window.SHV_SUPABASE && window.SHV_SUPABASE.url && window.SHV_SUPABASE.publishableKey) {
          supabase = window.supabase.createClient(window.SHV_SUPABASE.url, window.SHV_SUPABASE.publishableKey);
        }
      }
      initSupabase();

      // DOM elements
      const loginScreen = document.getElementById('loginScreen');
      const adminDashboard = document.getElementById('adminDashboard');
      const loginError = document.getElementById('loginError');
      const loginForm = document.getElementById('loginForm');
      const signOutBtn = document.getElementById('signOutBtn');
      const downloadsList = document.getElementById('downloadsList');
      const downloadToast = document.getElementById('downloadToast');
      const productsList = document.getElementById('productsList');
      const productToast = document.getElementById('productToast');
      const addProductBtn = document.getElementById('addProductBtn');
      const productForm = document.getElementById('productForm');
      const saveProductBtn = document.getElementById('saveProductBtn');
      const cancelProductBtn = document.getElementById('cancelProductBtn');
      const editingProductId = document.getElementById('editingProductId');
      const productFormTitle = document.getElementById('productFormTitle');

      function showToast(el, msg, type) {
        el.textContent = msg;
        el.className = 'toast ' + type;
        setTimeout(() => { el.classList.add('hidden'); }, 4000);
      }

      // Check auth on load
      async function checkAuth() {
        if (!supabase) {
          loginScreen.classList.remove('hidden');
          return;
        }
        const { data: { user }, error } = await supabase.auth.getUser();
        if (error || !user) {
          loginScreen.classList.remove('hidden');
          adminDashboard.classList.add('hidden');
          return;
        }
        currentUser = user;
        if (user.email !== ADMIN_EMAIL) {
          loginScreen.innerHTML = '<div class="glass-card" style="max-width:400px;margin:4rem auto;text-align:center;"><h2 class="text-xl font-black mb-2">Access Denied</h2><p class="text-gray-400">This panel is restricted to the site administrator.</p><button id="denySignOut" class="btn btn-dark mt-4">Sign Out</button></div>';
          document.getElementById('denySignOut')?.addEventListener('click', () => supabase.auth.signOut().then(() => location.reload()));
          return;
        }
        loginScreen.classList.add('hidden');
        adminDashboard.classList.remove('hidden');
        loadDownloads();
        loadProducts();
      }

      // Login
      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('adminEmail').value.trim();
        const password = document.getElementById('adminPassword').value;
        if (!supabase) return;
        const { error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) {
          loginError.textContent = error.message;
          loginError.classList.remove('hidden');
        } else {
          checkAuth();
        }
      });

      signOutBtn.addEventListener('click', async () => {
        await supabase.auth.signOut();
        location.reload();
      });

      // ---------- DOWNLOADS ----------
      async function loadDownloads() {
        const { data, error } = await supabase.from('site_downloads').select('*').order('code');
        if (error) {
          downloadsList.innerHTML = `<p class="text-red-400">Error: ${error.message}</p>`;
          return;
        }
        if (!data.length) {
          downloadsList.innerHTML = '<p class="text-gray-500">No download links defined.</p>';
          return;
        }
        downloadsList.innerHTML = data.map(item => `
          <div class="table-row">
            <div><strong>${item.code}</strong><br><span class="text-gray-500 text-xs">${item.label}${item.version ? ' · v' + item.version : ''}</span></div>
            <div class="text-xs text-gray-400 truncate">${item.url}</div>
            <div></div>
            <button class="btn btn-dark btn-sm edit-download" data-id="${item.id}" data-code="${item.code}" data-url="${item.url}" data-label="${item.label}" data-version="${item.version || ''}">Edit</button>
          </div>
        `).join('');

        document.querySelectorAll('.edit-download').forEach(btn => {
          btn.addEventListener('click', () => {
            const id = btn.dataset.id;
            const code = btn.dataset.code;
            const url = btn.dataset.url;
            const label = btn.dataset.label;
            const version = btn.dataset.version;
            const newUrl = prompt(`Edit URL for ${code}`, url);
            if (newUrl !== null) {
              const newLabel = prompt(`Edit label for ${code}`, label);
              const newVersion = prompt(`Edit version for ${code} (optional)`, version);
              updateDownload(id, { url: newUrl, label: newLabel, version: newVersion });
            }
          });
        });
      }

      async function updateDownload(id, updates) {
        const { error } = await supabase.from('site_downloads').update({
          ...updates,
          updated_at: new Date().toISOString()
        }).eq('id', id);
        if (error) {
          showToast(downloadToast, error.message, 'error');
        } else {
          showToast(downloadToast, 'Download link updated.', 'success');
          loadDownloads();
        }
      }

      // ---------- PRODUCTS ----------
      async function loadProducts() {
        const { data, error } = await supabase.from('products').select('*').order('created_at');
        if (error) {
          productsList.innerHTML = `<p class="text-red-400">Error: ${error.message}</p>`;
          return;
        }
        if (!data.length) {
          productsList.innerHTML = '<p class="text-gray-500">No products yet.</p>';
          return;
        }
        productsList.innerHTML = data.map(p => `
          <div class="table-row">
            <div><strong>${p.name}</strong><br><span class="text-xs text-gray-500">${p.status} · ${p.slug || 'no slug'}</span></div>
            <div class="text-xs text-gray-400">${(p.tags||[]).join(', ')}</div>
            <div></div>
            <div class="flex gap-2">
              <button class="btn btn-dark btn-sm edit-product" data-id="${p.id}">Edit</button>
              <button class="btn btn-danger btn-sm delete-product" data-id="${p.id}" data-name="${p.name}">Delete</button>
            </div>
          </div>
        `).join('');

        document.querySelectorAll('.edit-product').forEach(btn => {
          btn.addEventListener('click', async () => {
            const id = btn.dataset.id;
            const { data } = await supabase.from('products').select('*').eq('id', id).single();
            if (data) openProductForm(data);
          });
        });

        document.querySelectorAll('.delete-product').forEach(btn => {
          btn.addEventListener('click', async () => {
            if (confirm(`Delete "${btn.dataset.name}"? This cannot be undone.`)) {
              const { error } = await supabase.from('products').delete().eq('id', btn.dataset.id);
              if (error) showToast(productToast, error.message, 'error');
              else { showToast(productToast, 'Product deleted.', 'success'); loadProducts(); }
            }
          });
        });
      }

      function openProductForm(product = null) {
        productFormTitle.textContent = product ? 'Edit Product' : 'New Product';
        document.getElementById('prodName').value = product?.name || '';
        document.getElementById('prodTagline').value = product?.tagline || '';
        document.getElementById('prodDesc').value = product?.description || '';
        document.getElementById('prodImage').value = product?.image_url || '';
        document.getElementById('prodSlug').value = product?.slug || '';
        document.getElementById('prodTags').value = product?.tags?.join(', ') || '';
        document.getElementById('prodStatus').value = product?.status || 'live';
        editingProductId.value = product?.id || '';
        productForm.classList.remove('hidden');
      }

      addProductBtn.addEventListener('click', () => openProductForm(null));
      cancelProductBtn.addEventListener('click', () => productForm.classList.add('hidden'));

      saveProductBtn.addEventListener('click', async () => {
        const payload = {
          name: document.getElementById('prodName').value.trim(),
          tagline: document.getElementById('prodTagline').value.trim(),
          description: document.getElementById('prodDesc').value.trim(),
          image_url: document.getElementById('prodImage').value.trim(),
          slug: document.getElementById('prodSlug').value.trim(),
          tags: document.getElementById('prodTags').value.split(',').map(t => t.trim()).filter(Boolean),
          status: document.getElementById('prodStatus').value
        };
        const id = editingProductId.value;
        let error;
        if (id) {
          ({ error } = await supabase.from('products').update(payload).eq('id', id));
        } else {
          ({ error } = await supabase.from('products').insert(payload));
        }
        if (error) {
          showToast(productToast, error.message, 'error');
        } else {
          showToast(productToast, id ? 'Product updated.' : 'Product created.', 'success');
          productForm.classList.add('hidden');
          loadProducts();
        }
      });

      checkAuth();
    })();
  </script>
</body>
</html>
